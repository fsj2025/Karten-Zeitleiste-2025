<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lebensorte – Karl D'Angelo</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; font-family: Georgia, "Times New Roman", serif; background:#fff; }
* { box-sizing:border-box; }
.app { height:100vh; display:grid; grid-template-rows:64px 1fr; }
header { display:flex; align-items:center; padding:0 20px; border-bottom:1px solid #e5e5e5; font-size:20px; font-weight:600; }
.content { display:grid; grid-template-columns:1fr 280px; height:100%; }
#map { width:100%; height:100%; }
.sidebar { border-left:1px solid #e6e6e6; padding:20px 18px; background:#fafafa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
.legend-title { font-size:12px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:18px; color:#555; font-weight:600; }
.legend-item { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:15px; }
.legend-number { width:30px; height:30px; border-radius:999px; background:#b3261e; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; border:2px solid #fff; }
.num-pin { width:38px; height:38px; border-radius:999px; background:#b3261e; border:3px solid #fff; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.35); }
@media (max-width:800px) { .content { grid-template-columns:1fr; } .sidebar { border-left:none; border-top:1px solid #e6e6e6; } }
</style>
</head>

<body>
<div class="app">
<header>Lebensorte – Karl D'Angelo</header>
<div class="content">
<div id="map"></div>
<div class="sidebar">
<div class="legend-title">Legende</div>
<div class="legend-item"><div class="legend-number">1</div><div>Osthofen</div></div><div class="legend-item"><div class="legend-number">2</div><div>Mainz</div></div><div class="legend-item"><div class="legend-number">3</div><div>Dachau</div></div><div class="legend-item"><div class="legend-number">4</div><div>Cuxhaven</div></div><div class="legend-item"><div class="legend-number">5</div><div>Heilbronn</div></div><div class="legend-item"><div class="legend-number">6</div><div>Germersheim</div></div>
</div>
</div>
</div>

<script>
const places = [{"num": 1, "name": "Osthofen", "lat": 49.7063, "lon": 8.3286}, {"num": 2, "name": "Mainz", "lat": 49.9929, "lon": 8.2473}, {"num": 3, "name": "Dachau", "lat": 48.26, "lon": 11.434}, {"num": 4, "name": "Cuxhaven", "lat": 53.8617, "lon": 8.6947}, {"num": 5, "name": "Heilbronn", "lat": 49.1427, "lon": 9.2109}, {"num": 6, "name": "Germersheim", "lat": 49.2236, "lon": 8.3661}];
const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);

function pinIcon(num) {
  return L.divIcon({
    className:'',
    html:`<div class="num-pin">${num}</div>`,
    iconSize:[38,38],
    iconAnchor:[19,19]
  });
}

const bounds = [];
places.forEach(p => {
  L.marker([p.lat,p.lon], {icon:pinIcon(p.num)}).addTo(map);
  bounds.push([p.lat,p.lon]);
});
map.fitBounds(bounds, {padding:[50,50]});
setTimeout(()=>map.invalidateSize(),50);
</script>
</body>
</html>
