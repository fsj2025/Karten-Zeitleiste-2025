<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Lebensorte – Max Tschornicki</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;}
#map{width:100%;height:100vh;}
.topbar{position:fixed;top:14px;left:14px;right:14px;z-index:1000;display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
.title-pill{max-width:calc(100vw - 110px);background:rgba(255,255,255,.95);border-radius:14px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:14px;font-weight:600;color:#1f1f1f;pointer-events:auto;}
.legend-button{background:rgba(255,255,255,.95);border-radius:14px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:14px;font-weight:600;color:#1f1f1f;border:0;pointer-events:auto;}
.legend-panel{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#fff;border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -6px 18px rgba(0,0,0,.2);padding:16px 16px 24px;max-height:62vh;overflow-y:auto;transform:translateY(102%);transition:transform .25s ease;}
.legend-panel.open{transform:translateY(0);}
.legend-handle{width:42px;height:5px;border-radius:999px;background:#d4d4d4;margin:0 auto 14px;}
.legend-title{font-size:16px;font-weight:700;margin-bottom:14px;color:#1f1f1f;}
.legend-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;font-size:15px;color:#1f1f1f;}
.legend-number{width:32px;min-width:32px;height:32px;border-radius:999px;background:#b3261e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;}
.legend-text{line-height:1.25;padding-top:5px;}
.num-pin{width:42px;height:42px;border-radius:999px;background:#b3261e;border:3px solid #fff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1;}
.leaflet-control-attribution{font-size:10px;}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="title-pill">Lebensorte – Max Tschornicki</div>
  <button class="legend-button" onclick="toggleLegend()">Legende</button>
</div>
<div id="legend" class="legend-panel">
  <div class="legend-handle"></div>
  <div class="legend-title">Lebensorte – Max Tschornicki</div>
  <div class="legend-item"><div class="legend-number">1</div><div class="legend-text">Rüsselsheim</div></div><div class="legend-item"><div class="legend-number">2</div><div class="legend-text">Mainz</div></div><div class="legend-item"><div class="legend-number">3</div><div class="legend-text">Bingen</div></div><div class="legend-item"><div class="legend-number">4</div><div class="legend-text">Gießen</div></div><div class="legend-item"><div class="legend-number">5</div><div class="legend-text">KZ Osthofen</div></div><div class="legend-item"><div class="legend-number">6</div><div class="legend-text">Saarland</div></div><div class="legend-item"><div class="legend-number">7</div><div class="legend-text">Toulouse</div></div><div class="legend-item"><div class="legend-number">8</div><div class="legend-text">Marseille</div></div><div class="legend-item"><div class="legend-number">9</div><div class="legend-text">Lyon</div></div><div class="legend-item"><div class="legend-number">10</div><div class="legend-text">KZ Auschwitz</div></div><div class="legend-item"><div class="legend-number">11</div><div class="legend-text">KZ Buchenwald</div></div><div class="legend-item"><div class="legend-number">12</div><div class="legend-text">KZ Natzweiler</div></div><div class="legend-item"><div class="legend-number">13</div><div class="legend-text">KZ Dachau</div></div>
</div>
<script>
const places = [{"num": 1, "name": "Rüsselsheim", "lat": 49.9896, "lon": 8.422}, {"num": 2, "name": "Mainz", "lat": 49.9929, "lon": 8.2473}, {"num": 3, "name": "Bingen", "lat": 49.9667, "lon": 7.9}, {"num": 4, "name": "Gießen", "lat": 50.5873, "lon": 8.6755}, {"num": 5, "name": "KZ Osthofen", "lat": 49.7063, "lon": 8.3286}, {"num": 6, "name": "Saarland", "lat": 49.3964, "lon": 7.0229}, {"num": 7, "name": "Toulouse", "lat": 43.6047, "lon": 1.4442}, {"num": 8, "name": "Marseille", "lat": 43.2965, "lon": 5.3698}, {"num": 9, "name": "Lyon", "lat": 45.764, "lon": 4.8357}, {"num": 10, "name": "KZ Auschwitz", "lat": 50.0359, "lon": 19.1783}, {"num": 11, "name": "KZ Buchenwald", "lat": 51.0211, "lon": 11.2656}, {"num": 12, "name": "KZ Natzweiler", "lat": 48.4446, "lon": 7.2546}, {"num": 13, "name": "KZ Dachau", "lat": 48.26, "lon": 11.434}];
const map = L.map('map', {zoomControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
function pinIcon(num) {
  return L.divIcon({className:'', html:`<div class="num-pin">${num}</div>`, iconSize:[42,42], iconAnchor:[21,21]});
}
const bounds = [];
places.forEach(p => {
  L.marker([p.lat, p.lon], {icon: pinIcon(p.num)}).addTo(map);
  bounds.push([p.lat, p.lon]);
});
if (bounds.length === 1) {
  map.setView(bounds[0], 8);
} else {
  map.fitBounds(bounds, {padding:[34,34]});
}
function toggleLegend() {
  document.getElementById('legend').classList.toggle('open');
}
map.on('click', function() {
  document.getElementById('legend').classList.remove('open');
});
</script>
</body>
</html>
