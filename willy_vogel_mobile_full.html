<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Lebensorte – Willy Vogel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;}
#map{width:100%;height:100vh;}
.topbar{position:fixed;top:14px;left:14px;right:14px;z-index:1000;display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
.title-pill{max-width:calc(100vw - 110px);background:rgba(255,255,255,.95);border-radius:14px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:14px;font-weight:600;color:#1f1f1f;pointer-events:auto;}
.legend-button{background:rgba(255,255,255,.95);border-radius:14px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:14px;font-weight:600;color:#1f1f1f;border:0;pointer-events:auto;}
.legend-panel{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#fff;border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -6px 18px rgba(0,0,0,.2);padding:16px 16px 24px;max-height:62vh;overflow-y:auto;transform:translateY(102%);transition:transform .25s ease;}
.legend-panel.open{transform:translateY(0);}
.legend-handle{width:42px;height:5px;border-radius:999px;background:#d4d4d4;margin:0 auto 14px;}
.legend-title{font-size:16px;font-weight:700;margin-bottom:14px;color:#1f1f1f;}
.legend-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;font-size:15px;color:#1f1f1f;}
.legend-number{width:32px;min-width:32px;height:32px;border-radius:999px;background:#b3261e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;}
.legend-text{line-height:1.25;padding-top:5px;}
.num-pin{width:42px;height:42px;border-radius:999px;background:#b3261e;border:3px solid #fff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1;}
.leaflet-control-attribution{font-size:10px;}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="title-pill">Lebensorte – Willy Vogel</div>
  <button class="legend-button" onclick="toggleLegend()">Legende</button>
</div>
<div id="legend" class="legend-panel">
  <div class="legend-handle"></div>
  <div class="legend-title">Lebensorte – Willy Vogel</div>
  <div class="legend-item"><div class="legend-number">1</div><div class="legend-text">Worms</div></div><div class="legend-item"><div class="legend-number">2</div><div class="legend-text">Darmstadt</div></div><div class="legend-item"><div class="legend-number">3</div><div class="legend-text">KZ Osthofen</div></div><div class="legend-item"><div class="legend-number">4</div><div class="legend-text">Frankenthal</div></div><div class="legend-item"><div class="legend-number">5</div><div class="legend-text">Saarbrücken</div></div><div class="legend-item"><div class="legend-number">6</div><div class="legend-text">Paris</div></div><div class="legend-item"><div class="legend-number">7</div><div class="legend-text">Spanien</div></div><div class="legend-item"><div class="legend-number">8</div><div class="legend-text">St. Cyprien / Argelès-sur-Mer</div></div><div class="legend-item"><div class="legend-number">9</div><div class="legend-text">Gurs</div></div><div class="legend-item"><div class="legend-number">10</div><div class="legend-text">Andorra</div></div><div class="legend-item"><div class="legend-number">11</div><div class="legend-text">Miranda de Ebro</div></div><div class="legend-item"><div class="legend-number">12</div><div class="legend-text">Marokko</div></div><div class="legend-item"><div class="legend-number">13</div><div class="legend-text">Casablanca</div></div>
</div>
<script>
const places = [{"num": 1, "name": "Worms", "lat": 49.6341, "lon": 8.3592}, {"num": 2, "name": "Darmstadt", "lat": 49.8728, "lon": 8.6512}, {"num": 3, "name": "KZ Osthofen", "lat": 49.7063, "lon": 8.3286}, {"num": 4, "name": "Frankenthal", "lat": 49.537, "lon": 8.3556}, {"num": 5, "name": "Saarbrücken", "lat": 49.2402, "lon": 6.9969}, {"num": 6, "name": "Paris", "lat": 48.8566, "lon": 2.3522}, {"num": 7, "name": "Spanien", "lat": 40.4637, "lon": -3.7492}, {"num": 8, "name": "St. Cyprien / Argelès-sur-Mer", "lat": 42.55, "lon": 3.04}, {"num": 9, "name": "Gurs", "lat": 43.29, "lon": -0.75}, {"num": 10, "name": "Andorra", "lat": 42.5063, "lon": 1.5218}, {"num": 11, "name": "Miranda de Ebro", "lat": 42.687, "lon": -2.947}, {"num": 12, "name": "Marokko", "lat": 31.7917, "lon": -7.0926}, {"num": 13, "name": "Casablanca", "lat": 33.5731, "lon": -7.5898}];
const map = L.map('map', {zoomControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
function pinIcon(num) {
  return L.divIcon({className:'', html:`<div class="num-pin">${num}</div>`, iconSize:[42,42], iconAnchor:[21,21]});
}
const bounds = [];
places.forEach(p => {
  L.marker([p.lat, p.lon], {icon: pinIcon(p.num)}).addTo(map);
  bounds.push([p.lat, p.lon]);
});
if (bounds.length === 1) {
  map.setView(bounds[0], 8);
} else {
  map.fitBounds(bounds, {padding:[34,34]});
}
function toggleLegend() {
  document.getElementById('legend').classList.toggle('open');
}
map.on('click', function() {
  document.getElementById('legend').classList.remove('open');
});
</script>
</body>
</html>
