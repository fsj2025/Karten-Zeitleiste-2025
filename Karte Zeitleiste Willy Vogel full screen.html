<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lebensorte – Willy Vogel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{margin:0;height:100%;font-family:Georgia,"Times New Roman",serif;}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr;}
header{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e5e5e5;font-size:20px;font-weight:600;}
.content{display:grid;grid-template-columns:1fr 300px;height:100%;}
#map{width:100%;height:100%;}
.sidebar{border-left:1px solid #e6e6e6;padding:20px;background:#fafafa;font-family:Arial;}
.legend-title{font-weight:600;margin-bottom:15px;}

.legend-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15px;}
.legend-number{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#b3261e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
.legend-text{line-height:1.2;}

.num-pin{width:38px;height:38px;border-radius:50%;background:#b3261e;border:3px solid white;color:white;font-weight:800;display:flex;align-items:center;justify-content:center;}
</style>
</head>

<body>

<div class="app">
<header>Lebensorte – Willy Vogel</header>

<div class="content">
<div id="map"></div>

<div class="sidebar">
<div class="legend-title">Legende</div>
<div class="legend-item"><div class="legend-number">1</div><div class="legend-text">Worms</div></div><div class="legend-item"><div class="legend-number">2</div><div class="legend-text">Darmstadt</div></div><div class="legend-item"><div class="legend-number">3</div><div class="legend-text">KZ Osthofen</div></div><div class="legend-item"><div class="legend-number">4</div><div class="legend-text">Frankenthal</div></div><div class="legend-item"><div class="legend-number">5</div><div class="legend-text">Saarbrücken</div></div><div class="legend-item"><div class="legend-number">6</div><div class="legend-text">Paris</div></div><div class="legend-item"><div class="legend-number">7</div><div class="legend-text">Spanien</div></div><div class="legend-item"><div class="legend-number">8</div><div class="legend-text">St. Cyprien / Argelès-sur-Mer</div></div><div class="legend-item"><div class="legend-number">9</div><div class="legend-text">Gurs</div></div><div class="legend-item"><div class="legend-number">10</div><div class="legend-text">Andorra</div></div><div class="legend-item"><div class="legend-number">11</div><div class="legend-text">Miranda de Ebro</div></div><div class="legend-item"><div class="legend-number">12</div><div class="legend-text">Marokko</div></div><div class="legend-item"><div class="legend-number">13</div><div class="legend-text">Casablanca</div></div>
</div>

</div>
</div>

<script>
const places=[{"num": 1, "name": "Worms", "lat": 49.6341, "lon": 8.3592}, {"num": 2, "name": "Darmstadt", "lat": 49.8728, "lon": 8.6512}, {"num": 3, "name": "KZ Osthofen", "lat": 49.7063, "lon": 8.3286}, {"num": 4, "name": "Frankenthal", "lat": 49.537, "lon": 8.3556}, {"num": 5, "name": "Saarbrücken", "lat": 49.2402, "lon": 6.9969}, {"num": 6, "name": "Paris", "lat": 48.8566, "lon": 2.3522}, {"num": 7, "name": "Spanien", "lat": 40.4637, "lon": -3.7492}, {"num": 8, "name": "St. Cyprien / Argelès-sur-Mer", "lat": 42.55, "lon": 3.04}, {"num": 9, "name": "Gurs", "lat": 43.29, "lon": -0.75}, {"num": 10, "name": "Andorra", "lat": 42.5063, "lon": 1.5218}, {"num": 11, "name": "Miranda de Ebro", "lat": 42.687, "lon": -2.947}, {"num": 12, "name": "Marokko", "lat": 31.7917, "lon": -7.0926}, {"num": 13, "name": "Casablanca", "lat": 33.5731, "lon": -7.5898}];
const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function pinIcon(n){
return L.divIcon({
className:'',
html:`<div class="num-pin">${n}</div>`,
iconSize:[38,38],
iconAnchor:[19,19]
});
}

const bounds=[];

places.forEach(p=>{
L.marker([p.lat,p.lon],{icon:pinIcon(p.num)}).addTo(map);
bounds.push([p.lat,p.lon]);
});

map.fitBounds(bounds,{padding:[50,50]});

</script>

</body>
</html>
